name: Actualiser AppInvest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/actualiser.yml
  schedule:
    - cron: '17 23 * * 1-5'
      timezone: Europe/Paris
permissions:
  contents: write
concurrency:
  group: appinvest-data-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collecter les communiques officiels
        run: python3 collect_news.py
      - name: Collecter les nouvelles sources officielles
        continue-on-error: true
        timeout-minutes: 2
        run: python3 collect_extra_news.py
      - name: Collecter objectifs, finances et cours du catalogue
        continue-on-error: true
        run: node collect_discovery.cjs
      - name: Collecter les dossiers documentaires publics
        continue-on-error: true
        timeout-minutes: 5
        run: node collect_evidence.cjs
      - name: Publier donnees et bilan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biotech-data.json
          if [ -f discovery-data.json ] && node validate_public.cjs market; then git add discovery-data.json; fi
          if [ -f kinara-evidence-index.json ] && node validate_public.cjs evidence; then git add kinara-evidence-index.json evidence-dossiers; fi
          if [ -f extra-news.json ] && node validate_public.cjs news; then git add extra-news.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation des communiques et du catalogue biotech"
            git push
          fi
